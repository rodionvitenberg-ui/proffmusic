# ProffMusic — server block для /etc/nginx/sites-available/proffmusic.shop
# Этот файл СОДЕРЖИТ ТОЛЬКО server-блок (без events/http),
# т.к. он включается в основной nginx.conf сервера (multi-site, как daerdreee).

# Лимит загрузки файлов (для загрузки треков через админку)
client_max_body_size 100M;

server {
    listen 80;
    server_name proffmusic.shop www.proffmusic.shop 91.229.91.223;

    # Статика Django (админка)
    location /static/ {
        alias /var/www/proffmusic/backend/staticfiles/;
    }

    # Публичные медиа (обложки, превью)
    location /media/ {
        alias /var/www/proffmusic/backend/media/;
    }

    # Защищённые файлы (Nginx internal — только после проверки Django)
    location /protected_media/ {
        internal;
        alias /var/www/proffmusic/protected_media/;
    }

    # API и админка — на backend (Django + Gunicorn)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Всё остальное — Nuxt (web/) через PM2
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}