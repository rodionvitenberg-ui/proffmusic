events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Лимит загрузки файлов (для загрузки треков через админку)
    client_max_body_size 100M;

    upstream backend_server {
        server 127.0.0.1:8000;
    }

    upstream frontend_server {
        server 127.0.0.1:3000;
    }

    server {
        listen 80;
        server_name proffmusic.shop www.proffmusic.shop 91.229.91.223;

        # Статика Django (админка)
        location /static/ {
            alias /home/www/proffmusic/backend/staticfiles/;
        }

        # Публичные медиа (обложки, превью)
        location /media/ {
            alias /home/www/proffmusic/backend/media/;
        }

        # Защищённые файлы (Nginx internal — только после проверки Django)
        location /protected_media/ {
            internal;
            alias /home/www/proffmusic/protected_media/;
        }

        # API и админка — на backend (Django)
        location /api/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Всё остальное — на frontend (Next.js)
        location / {
            proxy_pass http://frontend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support для Next.js (если понадобится)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}